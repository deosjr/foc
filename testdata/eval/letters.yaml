  # ---------------------------------------------------------- conditional --
  - id: k01
    class: conditional
    general: saris
    location: hollow
    letter: Hold Hollow Wood if you can, but fall back if they come in force.
    expect: {action: hold, trigger: [outnumbered, attacked], then: retreat}
    accept: [entrench]

  - id: k02
