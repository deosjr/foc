# Labelled letters for `foc eval`. DRAFT: written by Claude for review.
#
# Each letter has a context (general, location, optional friendly positions and
# standing order) and the reading a human would expect:
#
#   class: clear      one fair reading. expect.action (+ expect.target for move
#                     and retreat) is what a human expects; `accept` lists other
#                     actions that would also be a fair reading.
#   class: ambiguous  several defensible readings, listed in `readings`. Used to
#                     check the probability split and that Velk and Saris diverge
#                     in the direction their traits predict.
#   class: conditional  one condition with an "otherwise": expect.action is
#                     what to do now, expect.trigger the fair readings of the
#                     condition, expect.then what to do when it happens.
#   class: unclear    no instruction can be made out; the general should hold
#                     (PoC: hold; later: ask for clarification).
#   class: none       no instruction at all (news, praise, questions); the
#                     letter should be ignored and the standing order kept.
#
# Actions: hold, move, support, entrench, scout, retreat. Targets are
# province ids; expect.whom names the general a support letter means.
# Locations used: karsa, velia, duna, oros, hollow, marren.

letters:
  # ---------------------------------------------------------------- clear --
  - id: c01
    class: clear
    general: velk
    location: velia
    letter: March on Oros Ford at once.
    expect: {action: move, target: oros}

  - id: c02
    class: clear
    general: saris
    location: duna
    letter: Hold Duna Hills. Do not move from there until you hear from me.
    expect: {action: hold}
    accept: [entrench]

  - id: c03
    class: clear
    general: velk
    location: hollow
    letter: Fall back to Velia.
    expect: {action: retreat, target: velia}
    accept: [move]

  - id: c04
    class: clear
    general: saris
