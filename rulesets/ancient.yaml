# Numbers for the ancient-world ruleset. Nothing era-specific belongs in code.
name: ancient
men_per_strength: 100      # strength 30 = 3,000 men
disband_below: 5
support_fraction: 0.5      # a supporter adds this share of its strength
entrench_bonus: 0.25       # added to the terrain multiplier from the second turn of entrenching
camp_bonus: 0.5            # added for an army refusing battle in a camp on strong ground (not plains); weaker attacks are called off
casualties:
  loser: 0.30
  winner: 0.10
  standoff: 0.10           # both sides in a tied battle
courier:
  provinces_per_turn: 2    # delay in turns = floor(hops / provinces_per_turn)
  interception: 0.10       # chance per route province that holds or neighbours an enemy army
perception:
  adjacent_strength_noise: 0.25
  strength_rounding: 5
  enemy_losses_noise: 0.20
distortion:
  caution_base: 0.6        # reported enemy strength = observed * (base + scale * caution)
  caution_scale: 0.8
  vanity_own: 0.6          # reported own losses = true * (1 - vanity_own * vanity)
  vanity_enemy: 0.6        # reported enemy losses = observed * (1 + vanity_enemy * vanity)
  omission: 0.6            # each piece of bad news is left out with p = omission * (1 - honesty)
victory:
  supply_centres_to_win: 5  # all of them: in the valley, effectively "take Kethra and hold it"
  hold_turns: 2            # a winning position must still stand at the end of the next turn
musters:
  every: 4                 # each winter (every fourth turn)...
  per_centre: 3            # ...each side raises 300 men per supply centre it holds
seasons: [Spring, Summer, Autumn, Winter]
